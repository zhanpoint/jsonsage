name: CI and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jsonsage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:unused
      - run: npm test
      - run: bash tests/deploy.test.sh
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Configure deployment identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$PUBLIC_URL"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Build and deploy the exact main revision
        id: release
        run: |
          set -o pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" "deploy $GITHUB_SHA" | tee "$RUNNER_TEMP/deploy.log"
          if grep -Fxq "DEPLOYED $GITHUB_SHA" "$RUNNER_TEMP/deploy.log"; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the public release
        if: steps.release.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PUBLIC_URL/healthz"
          actual=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PUBLIC_URL/version.json")
          test "$actual" = "{\"revision\":\"$GITHUB_SHA\"}"
          curl --fail --silent --show-error --head "$PUBLIC_URL/vendor/jq.mjs" | grep -iq '^content-type: application/javascript'
          curl --fail --silent --show-error --head "$PUBLIC_URL/vendor/jq.wasm" | grep -iq '^content-type: application/wasm'
          echo "Verified release $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
